<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<title>Argon CRM</title>
<!-- Shown by public/sw.js when a page can't load (no internet). Same
     screen as <BrandSplash> + <OfflineScreen> in the app; keep in sync. -->
<style>
  :root { --bg: #f7f5f2; --fg: #1d1b22; --muted: #7d7787; }
  html[data-mode="dark"] { --bg: #131217; --fg: #f3f1f6; --muted: #9a95a5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 24px; text-align: center;
  }
  svg { width: 210px; max-width: 55vw; height: auto; opacity: .4; }
  h1 { margin: 32px 0 0; font-size: 18px; font-weight: 700; }
  p { margin: 4px 0 0; font-size: 14px; color: var(--muted); max-width: 320px; }
  button {
    margin-top: 24px; height: 44px; padding: 0 24px; border: 0; border-radius: 999px;
    background: var(--fg); color: var(--bg); font: inherit; font-size: 14px; font-weight: 600;
  }
  .brand {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px);
    margin: 0; max-width: none; font-weight: 500;
  }
</style>
<script>
  try { if (localStorage.getItem('wacrm.mode') === 'dark') document.documentElement.dataset.mode = 'dark' } catch (e) {}
</script>
</head>
<body>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="arch" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fde3cf"/>
        <stop offset="1" stop-color="#b9b8f2"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="24" fill="#15141c"/>
    <path d="M31 77V50a19 19 0 0 1 38 0v27" fill="none" stroke="url(#arch)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="50" cy="61" r="5" fill="#fde3cf"/>
  </svg>
  <h1>No internet connection</h1>
  <p>Check your internet connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <p class="brand">Argon CRM.</p>
  <script>
    // Come back by itself as soon as the connection returns.
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
